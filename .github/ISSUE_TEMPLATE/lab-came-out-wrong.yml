name: A lab came out wrong
description: A generated lab or study note was wrong, gave the answer away, failed to deploy, or cost more than it said.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Every report like this turns into a fix in the skill's instructions or its checks.
        Remove account IDs, ARNs and anything else private before submitting.

  - type: input
    id: certification
    attributes:
      label: Certification
      placeholder: SAA-C03
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent, model and plugin version
      description: Run `/plugin` in Claude Code to see the installed version.
      placeholder: Claude Code, Opus 5.5, wrong-answer-labs 0.2.1
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: What went wrong
      multiple: true
      options:
        - The answer key is wrong
        - A challenge gives the answer away
        - The grader marks a correct solution wrong, or a wrong one right
        - The lab failed to deploy
        - The self-test failed
        - Cleanup left resources behind
        - It cost more than the lab said
        - It should have been a lab, or should have been docs-only
        - Something else
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you expected, what you got, and which challenge or file it was in.
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: The questions you used
      description: Summarize them in your own words if they come from a paid practice exam.

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: For example the output of `check.sh`, `selftest.sh` or `validate_lab.sh`.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed account IDs, ARNs and other private data.
          required: true
