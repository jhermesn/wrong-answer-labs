name: Tooling bug
description: A script, rule or CI check in this repository misbehaves.
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: What you ran
      placeholder: bash skills/wrong-answer-labs/scripts/validate_lab.sh labs/SAA-C03/my-lab
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `cfn-lint --version`, `cfn-guard --version` and your operating system.
      placeholder: cfn-lint 1.57.0, cfn-guard 3.2.1, macOS 26
