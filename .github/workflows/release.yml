name: release

# release-please keeps a release pull request open with the next semver
# version (from Conventional Commits), the changelog and the bumped
# .claude-plugin/plugin.json. Merging that pull request tags the version and
# publishes the GitHub release.

on:
  push:
    branches: [main]

# Two pushes in quick succession would both try to open the release pull request
# and the second run fails; queue the runs instead.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: pull requests opened with
      # GITHUB_TOKEN start no workflows without manual approval, so the release
      # pull request would never get its required `test` check.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
