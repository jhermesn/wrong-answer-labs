name: ci

on:
  pull_request:

permissions:
  contents: read

env:
  CFN_LINT_VERSION: 1.57.0
  # cfn-guard 3.2.1 is not on crates.io (latest there is 3.2.0), so build it from
  # the commit behind the 3.2.1 tag. A commit SHA, unlike a tag, cannot be moved.
  CFN_GUARD_REPO: https://github.com/aws-cloudformation/cloudformation-guard
  CFN_GUARD_REV: e531ef56092abb662e08fc6062c92db6d53f99c9 # 3.2.1
  # Agent Skills spec validator (not published to PyPI), pinned to a commit.
  SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cfn-lint
        run: pipx install "cfn-lint==${CFN_LINT_VERSION}"

      - name: Install cfn-guard
        run: cargo install cfn-guard --git "${CFN_GUARD_REPO}" --rev "${CFN_GUARD_REV}" --locked

      - name: Validate skill against the Agent Skills spec
        run: |
          pipx install "${SKILLS_REF}"
          for skill in skills/*/; do skills-ref validate "${skill%/}"; done

      - name: ShellCheck
        run: shellcheck -S warning skills/*/scripts/*.sh skills/*/assets/lab/*.sh skills/*/assets/lab/solution/*.sh tests/*.sh

      - name: Rules, validator and examples
        run: bash tests/run.sh
