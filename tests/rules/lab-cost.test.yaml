# Unit tests for rules/lab-cost.guard, run with `cfn-guard test`.
# Each FAIL case breaks exactly one condition so a broken condition cannot hide
# behind another one. SKIP means the rule found nothing to evaluate.
# Whether every resource type named in the rules exists is checked separately
# by tests/run.sh through cfn-lint.

# --- COST_ALLOWED_RESOURCE_TYPES --------------------------------------------

- name: template with only reviewed resource types passes
  input:
    Resources:
      Bucket: {Type: AWS::S3::Bucket}
      Table: {Type: AWS::DynamoDB::Table}
      Queue: {Type: AWS::SQS::Queue}
  expectations:
    rules: {COST_ALLOWED_RESOURCE_TYPES: PASS}

- name: provisioned redshift cluster is not allowed
  input:
    Resources:
      Warehouse: {Type: AWS::Redshift::Cluster}
  expectations:
    rules: {COST_ALLOWED_RESOURCE_TYPES: FAIL}

- name: unreviewed memorydb cluster is not allowed
  input:
    Resources:
      Memory: {Type: AWS::MemoryDB::Cluster}
  expectations:
    rules: {COST_ALLOWED_RESOURCE_TYPES: FAIL}

- name: legacy elasticsearch domain is not allowed
  input:
    Resources:
      Search: {Type: AWS::Elasticsearch::Domain}
  expectations:
    rules: {COST_ALLOWED_RESOURCE_TYPES: FAIL}

- name: custom resource type is not allowed
  input:
    Resources:
      Seeder: {Type: 'Custom::SeedData', Properties: {ServiceToken: arn:aws:lambda:us-east-1:123456789012:function:seed}}
  expectations:
    rules: {COST_ALLOWED_RESOURCE_TYPES: FAIL}

- name: generic cloudformation custom resource is not allowed
  input:
    Resources:
      Seeder: {Type: AWS::CloudFormation::CustomResource}
  expectations:
    rules: {COST_ALLOWED_RESOURCE_TYPES: FAIL}

- name: one unreviewed type among allowed ones is not allowed
  input:
    Resources:
      Bucket: {Type: AWS::S3::Bucket}
      Dax: {Type: AWS::DAX::Cluster}
  expectations:
    rules: {COST_ALLOWED_RESOURCE_TYPES: FAIL}

# --- COST_EC2_INSTANCE_TYPE -------------------------------------------------

- name: t3.micro instance passes
  input:
    Resources:
      Vm: {Type: AWS::EC2::Instance, Properties: {InstanceType: t3.micro}}
  expectations:
    rules: {COST_EC2_INSTANCE_TYPE: PASS}

- name: t4g.small instance passes as the largest allowed size
  input:
    Resources:
      Vm: {Type: AWS::EC2::Instance, Properties: {InstanceType: t4g.small}}
  expectations:
    rules: {COST_EC2_INSTANCE_TYPE: PASS}

- name: t3.medium instance fails as one size above the limit
  input:
    Resources:
      Vm: {Type: AWS::EC2::Instance, Properties: {InstanceType: t3.medium}}
  expectations:
    rules: {COST_EC2_INSTANCE_TYPE: FAIL}

- name: m5.large instance fails
  input:
    Resources:
      Vm: {Type: AWS::EC2::Instance, Properties: {InstanceType: m5.large}}
  expectations:
    rules: {COST_EC2_INSTANCE_TYPE: FAIL}

- name: instance type from a parameter fails because sizes must be literal
  input:
    Resources:
      Vm: {Type: AWS::EC2::Instance, Properties: {InstanceType: {Ref: Size}}}
  expectations:
    rules: {COST_EC2_INSTANCE_TYPE: FAIL}

- name: instance without InstanceType fails because the default is not validated
  input:
    Resources:
      Vm: {Type: AWS::EC2::Instance, Properties: {ImageId: ami-12345678}}
  expectations:
    rules: {COST_EC2_INSTANCE_TYPE: FAIL}

- name: template without instances skips the instance type rule
  input:
    Resources:
      Bucket: {Type: AWS::S3::Bucket}
  expectations:
    rules: {COST_EC2_INSTANCE_TYPE: SKIP}

